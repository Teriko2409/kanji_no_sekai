<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bombu</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Klee One', cursive, sans-serif;
            background-color: #f4f4f9;
            margin: 0;

        }
        .button_retour {

            background: mediumvioletred;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    <div>Niveau : {{ level }}</div>
</div>
<audio id="theme" loop>
    <source src="{{ url_for('static', filename='audio/bombu_theme.mp3') }}" type="audio/mpeg">
</audio>

<script src="{{ url_for('static', filename='kanji_no_sekai_audio_setting.js') }}"></script>
<script>
    const rac = (id_element_page) => document.getElementById(id_element_page);

    const kanji_data_bombe_url = '/bombu_data';
    const player_data_url = '/player_data';
    const save_player_url = '/player_save';

    playMusic({{mute}});

</html>
