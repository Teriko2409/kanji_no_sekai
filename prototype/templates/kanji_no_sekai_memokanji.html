<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MemoKanji</title>
    <style>
        .button_retour {
            padding: 10px 20px;
            font-size: 16px;
            background-color: mediumvioletred;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        :root {
            --ink: #2b2b2b;
            --paper: #faf6ee;
            --accent: #c8402f;
            --ok: #3a8a4f;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, "Noto Sans CJK JP", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 16px;
            background: var(--paper);
            color: var(--ink);
            max-width: 560px;
            margin-inline: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        #table {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 800px;
        }

        .carte {
            aspect-ratio: 4/3;
            position: relative;
            cursor: pointer;
            border: 0;
            background: none;
            padding: 0;
            transform-style: preserve-3d;
            transition: transform .35s;
        }

        .carte.retournee, .carte.trouvee {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--ink);
            border-radius: 12px;
            backface-visibility: hidden;
            text-align: center;
            padding: 6px;
        }

        .dos {
            background: var(--accent);
            color: #fff;
            font-size: 2rem;
        }

        .avant {
            transform: rotateY(180deg);
            background: #fff;
            font-size: 2.4rem;
            font-family: "Klee One", sans-serif;
            font-weight: 600;
        }

        .carte.trouvee .avant {
            background: #e6f4ea;
            border-color: var(--ok);
        }

        #end {
            display: none;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
        }

        #end .win {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
        }

        #end .win span {
            font-size: 1.8rem;
            border: 2px solid var(--ok);
            border-radius: 8px;
            padding: 2px 10px;
            background: #e6f4ea;
            font-family: "Klee One", sans-serif;
            font-weight: 600;
        }

        button.action {
            font-size: 1rem;
            padding: 10px 16px;
            border: 2px solid var(--ink);
            background: var(--ink);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<button class="button_retour" onclick="location.href='/choice_game_distinction'">Back</button>
<header>
    <strong>MemoKanji</strong>
    <div>
        <span>ID : <span id="player_id">{{ player_id }}</span></span> |
        <span>Level : <span id="level">{{ level }}</span></span>
    </div>
</header>

<div id="table"></div>

<div id="end">
    <h2>成功 !🎉</h2>
    <p>新</p>
    <div class="win" id="win_id"></div>
    <button class="action" onclick="loadGame()">やり直す</button>
</div>
<audio id="theme" loop>
    <source src="{{ url_for('static', filename='audio/memokanji_theme.mp3') }}" type="audio/mpeg">
</audio>

<script src="{{ url_for('static', filename='kanji_no_sekai_audio_setting.js') }}"></script>
<script>

    const rac = (id_element_page) => document.getElementById(id_element_page);

    const kanji_data_url = '/memokanji_data';
    const player_data_url = '/player_data';
    const save_player_url = '/player_save';

    let kanji_on_carte = [];
    let kanji_already_player = [];
    let time_error_to_watch = 1200;
    let firstCard = null, lockBoard = false;
    let pairsCount = 0;

    // ============ CARDS SETTING ============
    async function loadGame() {
        const responseCards = await fetch(kanji_data_url);
        kanji_on_carte = await responseCards.json();
        const responsePlayer = await fetch(player_data_url);
        kanji_already_player = await responsePlayer.json();
        newGame();
    }

    // ============ GAME ============
    function newGame() {
        pairsCount = 0;
        firstCard = null;
        lockBoard = false;

        rac("end").style.display = "none";

        const shuffledCards = [...kanji_on_carte];
        for (let i = shuffledCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledCards[i], shuffledCards[j]] = [shuffledCards[j], shuffledCards[i]];
        }

        const grid = rac("table");
        grid.innerHTML = "";

        const fragment = document.createDocumentFragment();

        shuffledCards.forEach((ch) => {
            const card = document.createElement("button");
            card.className = "carte";
            card.dataset.id = ch;
            card.innerHTML = `<div class="face dos">後</div><div class="face avant"></div>`;
            card.querySelector(".avant").textContent = ch;
            card.addEventListener("click", () => clickCard(card));
            fragment.appendChild(card);
        });

        grid.appendChild(fragment);
    }

    function clickCard(card) {
        if (lockBoard || card === firstCard || card.classList.contains("trouvee")) return;
        card.classList.add("retournee");

        if (!firstCard) {
            firstCard = card;
            return;
        }

        if (firstCard.dataset.id === card.dataset.id) {
            firstCard.classList.add("trouvee");
            card.classList.add("trouvee");

            firstCard = null;
            pairsCount++;
            if (pairsCount === kanji_on_carte.length / 2) finishGame();
        } else {
            lockBoard = true;
            const a = firstCard, b = card;
            setTimeout(() => {
                a.classList.remove("retournee");
                b.classList.remove("retournee");
                lockBoard = false;
            }, time_error_to_watch);
            firstCard = null;
        }
    }

    async function finishGame() {
        const box = document.getElementById("win_id");
        box.innerHTML = "";

        const uniqueKanjis = [...new Set(kanji_on_carte)];
        const newKanjis = uniqueKanjis.filter(kanji => !kanji_already_player.includes(kanji));

        newKanjis.forEach(ch => {
            const sp = document.createElement("span");
            sp.textContent = ch;
            box.appendChild(sp);
        });

        rac("end").style.display = "block";

        if (newKanjis.length > 0) {
            try {
                await fetch(save_player_url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ kanjis: newKanjis })
                });
            } catch (err) {
                console.error("Erreur d'envoi des kanjis :", err);
            }
        }
    }

    playMusic({{ mute }});
    loadGame();

</script>
</body>
</html>
