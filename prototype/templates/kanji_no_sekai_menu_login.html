<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>kanji no sekai login</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }

        .login-box {
            border: 1px solid #714B67;
            width: 300px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background: white;
        }

        input, select {
            display: block;
            margin: 12px 0;
            padding: 8px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #8a2076;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background-color: #5a3b52;
        }

        .error {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Login</h2>

    {% if erreur %}
    <p class="error">{{ erreur }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('menu') }}">
        <label for="id_player">Player info:</label>
        <input type="number" id="id_player" name="id_player" min="1" placeholder="ID" required>
        <label for="level">JLPT level :</label>
        <select id="level" name="level" required>
            <option value="5">JLPT N5</option>
            <option value="4">JLPT N4</option>
            <option value="3">JLPT N3</option>
            <option value="2">JLPT N2</option>
            <option value="1">JLPT N1</option>
        </select>

        <button type="submit">Se connecter</button>
    </form>
</div>
</body>
</html>
