<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>kanji no sekai login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .login-box { border: 1px solid #714B67; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white; }
        input { display: block; margin: 12px 0; padding: 8px; width: 220px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #714B67; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #5a3b52; }
        .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>

        {% if erreur %}
            <p class="error">{{ erreur }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('menu') }}">
            <label for="id_player">Player info:</label>
            <input type="number" id="id_player" name="id_player" min="1" placeholder="ID" required>
            <input type="number" id="level" name="level" min="1" max='5' placeholder="JLPT" required>

    <button type="submit">Se connecter</button>
</form>
    </div>
</body>
</html>
