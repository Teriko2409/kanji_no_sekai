<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kanji Passport, please</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📃</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <style>
        button.action {
            font-size: 1rem;
            padding: 10px 16px;
            border: 2px solid var(--ink);
            background: var(--ink);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
        }
        :root {
            --ink: #2b2b2b;
            --paper: #faf6ee;
            --ok: #8fc31f;
            --ko: #e5231b;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, "Noto Sans CJK JP", "Yu Gothic", sans-serif;
            margin: 0 auto;
            padding: 16px;
            background: var(--paper);
            color: var(--ink);
            max-width: 560px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .button_retour {
            padding: 8px 16px;
            font-size: 15px;
            background: mediumvioletred;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #stage {
            position: relative;
            height: 190px;
            overflow: hidden;
            margin-top: 10px;
        }

        #walker {
            position: absolute;
            top: 6px;
            left: -40%;
            transform: translateX(-50%);
        }

        #sprite {
            display: inline-block;
            font-family: "Klee One", sans-serif;
            font-size: 7.5rem;
            line-height: 1.1;
            font-weight: 600;
        }

        #walker.in {
            animation: walkIn var(--walk-in-duration, 3.0s) ease-out forwards;
        }

        #walker.out-right {
            animation: walkOutRight var(--walk-out-duration, 0.9s) ease-in forwards;
        }

        #walker.out-left {
            animation: walkOutLeft var(--walk-out-duration, 0.9s) ease-in forwards;
        }

        #sprite.walking {
            animation: bob 0.35s ease-in-out infinite;
        }

        @keyframes walkIn {
            from {
                left: -40%;
            }
            to {
                left: 50%;
            }
        }

        @keyframes walkOutRight {
            from {
                left: 50%;
            }
            to {
                left: 140%;
            }
        }

        @keyframes walkOutLeft {
            from {
                left: 50%;
            }
            to {
                left: -40%;
            }
        }

        @keyframes bob {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-12px) rotate(4deg);
            }
        }

        .card-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        #card {
            flex-grow: 1;
            min-width: 0;
            display: none;
            background: #ffe94d;
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 10px;
            min-height: 170px;
            overflow-wrap: anywhere;
        }

        #card.show {
            display: block;
            animation: pop 0.45s ease-out;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .head {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        #profile {
            width: 60px;
            height: 60px;
            box-sizing: border-box;

            font-size: 2.6rem;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 6px;

            padding: 0;
            line-height: 1.3;

            font-family: "Klee One", sans-serif;
            font-weight: 600;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row {
            margin: 6px 0 0;
            font-size: 1.25rem;
        }

        .row b {
            display: inline-block;
            min-width: 80px;
            font-weight: 600;
        }

        .btns {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 10px 0;
        }

        .round {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 1px solid var(--ink);
            font-size: 2.6rem;
            color: #fff;
            cursor: pointer;
        }

        .round:disabled {
            opacity: .35;
            cursor: default;
        }

        #refuse {
            background: var(--ko);
        }

        #approve {
            background: var(--ok);
        }

        #end {
            display: none;
            text-align: center;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        #end button {
            cursor: pointer;
        }

        /* Grilles pour les listes de kanjis */
        .kanji-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 8px 0 12px 0;
        }

        /* Style pour les réussites (Rights) et Nouveaux Kanjis */
        .rights-grid span {
            font-size: 1.8rem;
            border: 2px solid var(--ok);
            border-radius: 8px;
            padding: 2px 10px;
            background: #e6f4ea;
            font-family: "Klee One", sans-serif;
            font-weight: 600;
            color: var(--ok);
        }

        /* Style pour les erreurs (Mistakes) */
        .mistakes-grid span {
            font-size: 1.8rem;
            border: 2px solid var(--ko);
            border-radius: 8px;
            padding: 2px 10px;
            background: #fde8e8;
            font-family: "Klee One", sans-serif;
            font-weight: 600;
            color: var(--ko);
        }

        .empty-notice {
            font-size: 1.2rem;
            font-family: "Klee One", sans-serif;
            color: #777;
            margin: 4px 0 8px 0;
        }

        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .card-container {
                gap: 6px;
            }

            .row {
                font-size: 1.05rem;
            }

            .row b {
                min-width: 70px;
            }
        }
    </style>
</head>

<body>

<div class="top">
    <button
            class="button_retour"
            onclick="location.href='/choice_game_meaning'">
        BACK
    </button>

    <div>
        ID : {{ player_id }} | Level : {{ level }}
    </div>
</div>

<div id="stage">
    <div id="walker">
        <span id="sprite"></span>
    </div>
</div>

<div class="card-container">
    <div id="card">
        <div class="row">
            <div id="profile"></div>
        </div>

        <div class="row">
            <b>訓読み:</b>
            <span id="kun"></span>
        </div>

        <div class="row">
            <b>音読み:</b>
            <span id="on"></span>
        </div>

        <div class="row">
            <b>部首 :</b>
            <span id="radical"></span>
        </div>

        <div class="row">
            <b>語彙 :</b>
            <span id="words"></span>
        </div>
    </div>
</div>

<div class="btns">
    <button class="round" id="refuse" type="button" hidden>
        無
    </button>

    <button class="round" id="approve" type="button" hidden>
        有
    </button>
</div>

<div id="end"></div>

<audio id="theme" loop>
    <source src="{{ url_for('static', filename='audio/paper_theme.mp3') }}" type="audio/mpeg">
</audio>

<script src="{{ url_for('static', filename='kanji_no_sekai_audio_setting.js') }}"></script>
<script>
    const rac = (id_element_page) => document.getElementById(id_element_page);

    const data_kanji_launcher_url = "/paper_data";
    const data_player_launcher_url = "/player_data";
    const update_player_url = "/player_save";

    let kanji = [];
    let player_kanji_already = [];
    let kanji_number_order = 0;
    let hasAnswered = false;
    let mistakes = [];
    let rights = [];

    let kanji_speed = 1.3;
    let lastPlayerChoice = true;

    document.documentElement.style.setProperty('--walk-in-duration', kanji_speed + 's');
    document.documentElement.style.setProperty('--walk-out-duration', (kanji_speed * 0.5) + 's');

    async function loadGame() {
        playMusic({{mute}});
        newGame();
    }

    async function newGame() {
        const response_data_paper = await fetch(data_kanji_launcher_url);
        kanji = await response_data_paper.json();
        const response_data_player = await fetch(data_player_launcher_url);
        player_kanji_already = await response_data_player.json();

        kanji_number_order = 0;
        hasAnswered = false;
        mistakes = [];
        rights = [];

        rac("stage").style.display = "block";
        rac("card").style.display = "none";
        document.querySelector(".btns").style.display = "flex";
        rac("end").style.display = "none";

        kanjiWalksIn();
    }

    function kanjiWalksIn() {
        if (kanji_number_order == kanji.length) {
            finishGame();
            return;
        }

        rac("sprite").textContent = kanji[kanji_number_order].kanji ?? "";
        rac("sprite").classList.add("walking");

        rac("walker").className = "";
        void rac("walker").offsetWidth;
        rac("walker").className = "in";
    }

    rac("walker").addEventListener("animationend", (event) => {
        if (event.target !== rac("walker")) {
            return;
        }

        rac("sprite").classList.remove("walking");

        if (event.animationName === "walkIn") {
            showCard();

        } else if (event.animationName === "walkOutRight" || event.animationName === "walkOutLeft") {
            kanji_number_order++;

            if (kanji_number_order == kanji.length) {
                finishGame();
            } else {
                kanjiWalksIn();
            }
        }
    });

    function showCard() {
        const card = kanji[kanji_number_order];

        rac("profile").textContent = card.profile;
        rac("kun").textContent = card.kunyomi;
        rac("on").textContent = card.onyomi;
        rac("radical").textContent = card.radical;

        const vocabulary = card.vocabulary;

        if (Array.isArray(vocabulary)) {
            rac("words").textContent = vocabulary
                .map((word) => {
                    if (word && typeof word === "object") {
                        return word.reading ?? word.word ?? "";
                    }
                    return word ?? "";
                })
                .join("、");
        } else {
            rac("words").textContent = vocabulary ?? "";
        }

        rac("card").style.display = "block";
        rac("card").classList.add("show");

        hasAnswered = false;
        rac("approve").hidden = false;
        rac("approve").disabled = false;

        rac("refuse").hidden = false;
        rac("refuse").disabled = false;
    }

    function answer(playerSaysValid) {
        if (hasAnswered) {
            return;
        }

        hasAnswered = true;
        lastPlayerChoice = playerSaysValid;

        const card = kanji[kanji_number_order];
        const playerIsRight = (playerSaysValid === card.correct);

        if (playerIsRight) {
            rights.push(card.kanji);
        } else {
            mistakes.push(card.kanji);
        }

        rac("approve").disabled = true;
        rac("refuse").disabled = true;

        nextCard();
    }

    function nextCard() {
        if (!hasAnswered) {
            return;
        }
        rac("approve").hidden = true;
        rac("refuse").hidden = true;

        rac("card").classList.remove("show");
        rac("card").style.display = "none";

        rac("sprite").classList.add("walking");

        rac("walker").className = "";
        void rac("walker").offsetWidth;

        if (lastPlayerChoice) {
            rac("walker").className = "out-right";
        } else {
            rac("walker").className = "out-left";
        }
    }

    async function finishGame() {
        rac("stage").style.display = "none";
        rac("card").style.display = "none";
        document.querySelector(".btns").style.display = "none";
        rac("end").style.display = "block";

        const rightsTitle = document.createElement("p");
        rightsTitle.style.fontWeight = "600";
        rightsTitle.style.marginTop = "5px";
        rightsTitle.textContent = "Correct answers:";

        const rightsGrid = document.createElement("div");
        rightsGrid.className = "kanji-grid rights-grid";

        if (rights.length > 0) {
            rights.forEach(ch => {
                const sp = document.createElement("span");
                sp.textContent = ch;
                rightsGrid.appendChild(sp);
            });
        } else {
            const emptyNotice = document.createElement("div");
            emptyNotice.className = "empty-notice";
            emptyNotice.textContent = "...";
            rightsGrid.appendChild(emptyNotice);
        }


        const mistakesTitle = document.createElement("p");
        mistakesTitle.style.fontWeight = "600";
        mistakesTitle.style.marginTop = "15px";
        mistakesTitle.textContent = "Mistakes made:";

        const mistakesGrid = document.createElement("div");
        mistakesGrid.className = "kanji-grid mistakes-grid";

        if (mistakes.length > 0) {
            mistakes.forEach(ch => {
                const sp = document.createElement("span");
                sp.textContent = ch;
                mistakesGrid.appendChild(sp);
            });
        } else {
            const emptyNotice = document.createElement("div");
            emptyNotice.className = "empty-notice";
            emptyNotice.textContent = "...";
            mistakesGrid.appendChild(emptyNotice);
        }


        const learnedTitle = document.createElement("p");
        learnedTitle.style.fontWeight = "600";
        learnedTitle.style.marginTop = "15px";
        learnedTitle.textContent = "New Kanjis learned:";

        const learnedGrid = document.createElement("div");
        learnedGrid.className = "kanji-grid rights-grid";

        const uniqueRights = [...new Set(rights)];
        const newKanjis = uniqueRights.filter(k => !player_kanji_already.includes(k));

        if (uniqueRights.length > 0) {
            newKanjis.forEach(ch => {
                const sp = document.createElement("span");
                sp.textContent = ch;
                learnedGrid.appendChild(sp);
            });

            try {
                await fetch(update_player_url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ kanjis: uniqueRights })
                });
            } catch (err) {
                console.error("Erreur d'envoi des kanjis :", err);
            }
        } else {
            const emptyNotice = document.createElement("div");
            emptyNotice.className = "empty-notice";
            emptyNotice.textContent = "...";
            learnedGrid.appendChild(emptyNotice);
        }


        const playAgain = document.createElement("button");
        playAgain.className = "action";
        playAgain.style.marginTop = "15px";
        playAgain.textContent = "やり直す";

        playAgain.addEventListener("click", () => {
            newGame();
        });

        rac("end").replaceChildren(
            rightsTitle,
            rightsGrid,
            mistakesTitle,
            mistakesGrid,
            learnedTitle,
            learnedGrid,
            playAgain
        );
    }

    rac("approve").addEventListener("click", () => {
        answer(true);
    });

    rac("refuse").addEventListener("click", () => {
        answer(false);
    });

    loadGame();
</script>

</body>
</html>
