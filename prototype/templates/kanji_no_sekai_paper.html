<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kanji Passport, please</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #2b2b2b;
            --paper: #faf6ee;
            --ok: #8fc31f;
            --ko: #e5231b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, "Noto Sans CJK JP", "Yu Gothic", sans-serif;
            margin: 0 auto;
            padding: 16px;
            background: var(--paper);
            color: var(--ink);
            max-width: 560px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .button_retour {
            padding: 8px 16px;
            font-size: 15px;
            background: mediumvioletred;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #progress {
            margin: 8px 0;
            font-size: 0.9rem;
        }


        #stage {
            position: relative;
            height: 190px;
            overflow: hidden;
        }

        #walker {
            position: absolute;
            top: 6px;
            left: -40%;
            transform: translateX(-50%);
        }

        #sprite {
            display: inline-block;
            font-family: "Klee One", sans-serif;
            font-size: 7.5rem;
            line-height: 1.1;
            font-weight: 600;
        }

        #walker.in {
            animation: walkIn 3.0s ease-out forwards;
        }

        #walker.out {
            animation: walkOut 0.9s ease-in forwards;
        }

        #sprite.walking {
            animation: bob 0.35s ease-in-out infinite;
        }

        @keyframes walkIn {
            from {
                left: -40%;
            }
            to {
                left: 50%;
            }
        }

        @keyframes walkOut {
            from {
                left: 50%;
            }
            to {
                left: 140%;
            }
        }

        @keyframes bob {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-12px) rotate(4deg);
            }
        }

        .card-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        #card {
            flex-grow: 1;
            min-width: 0;
            display: none;
            background: #ffe94d;
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 10px;
            min-height: 170px;
            overflow-wrap: anywhere;
        }

        #card.show {
            display: block;
            animation: pop 0.45s ease-out;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .head {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        #profile {
            width: 60px;
            height: 60px;
            box-sizing: border-box;

            font-size: 2.6rem;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 6px;

            padding: 0;
            line-height: 1.3;

            font-family: "Klee One", sans-serif;
            font-weight: 600;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row {
            margin: 6px 0 0;
            font-size: 1.25rem;
        }

        .row b {
            display: inline-block;
            min-width: 80px;
            font-weight: 600;
        }

        .btns {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 10px 0;
        }

        .round {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 1px solid var(--ink);
            font-size: 2.6rem;
            color: #fff;
            cursor: pointer;
        }

        .round:disabled {
            opacity: .35;
            cursor: default;
        }


        #refuse {
            background: var(--ko);
        }

        #approve {
            background: var(--ok);
        }

        #end {
            display: none;
            text-align: center;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        #end button {
            cursor: pointer;
        }

        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .card-container {
                gap: 6px;
            }

            .row {
                font-size: 1.05rem;
            }

            .row b {
                min-width: 70px;
            }

        }
    </style>
</head>

<body>


<div class="top">
    <button
            class="button_retour"
            onclick="location.href='/choice_game_meaning'">
        BACK
    </button>

    <div>
        ID : {{ player_id }} | Level : {{ level }}
    </div>
</div>


<div id="progress">
    <span id="kanji_number"></span>
</div>

<div id="stage">
    <div id="walker">
        <span id="sprite"></span>
    </div>
</div>

<div class="card-container">

    <div id="card">
        <div class="row">
            <div id="profile"></div>
        </div>

        <div class="row">
            <b>訓読み:</b>
            <span id="kun"></span>
        </div>

        <div class="row">
            <b>音読み:</b>
            <span id="on"></span>
        </div>

        <div class="row">
            <b>部首 :</b>
            <span id="radical"></span>
        </div>

        <!--
 <div class="row">
     <b>correct:</b>
     <span id="correct"></span>
 </div>
 -->

        <div class="row">
            <b>語彙 :</b>
            <span id="words"></span>
        </div>
    </div>


</div>

<div class="btns">
    <button class="round" id="refuse" type="button" hidden>
        無
    </button>

    <button class="round" id="approve" type="button" hidden>
        有
    </button>
</div>

<div id="end"></div>
<audio id="theme" loop>
    <source src="{{ url_for('static', filename='audio/paper_theme.mp3') }}" type="audio/mpeg">
</audio>
<script src="{{ url_for('static', filename='kanji_no_sekai_audio_setting.js') }}"></script>
<script>
    const rac = (id_element_page) => document.getElementById(id_element_page);

    const data_kanji_launcher_url = "/paper_data";
    const data_player_launcher_url = "/player_data";
    const update_playey_url = "/";


    let kanji = [];
    let player_kanji_already = []
    let kanji_number_order = 0;
    let score = 0;
    let hasAnswered = false;


    async function start_game() {

        const response_data_kanji = await fetch(data_kanji_launcher_url);

        const kanji_data_json = await response_data_kanji.json();

        kanji = kanji_data_json;


        kanjiWalksIn();

    }

    function kanjiWalksIn() {
        if (kanji_number_order == kanji.length) {
            finishGame();
            return;
        }

        rac("kanji_number").textContent = kanji_number_order + 1;

        rac("sprite").textContent = kanji[kanji_number_order].kanji ?? "";

        rac("sprite").classList.add("walking");


        rac("walker").className = "";
        void rac("walker").offsetWidth;
        rac("walker").className = "in";
    }

    rac("walker").addEventListener("animationend", (event) => {
        if (event.target !== rac("walker")) {
            return;
        }

        rac("sprite").classList.remove("walking");

        if (event.animationName === "walkIn") {
            showCard();

        } else if (event.animationName === "walkOut") {
            kanji_number_order++;

            if (kanji_number_order == kanji.length) {
                finishGame();
            } else {
                kanjiWalksIn();
            }
        }
    });

    function showCard() {
        const card = kanji[kanji_number_order];

        rac("profile").textContent = card.profile;
        rac("kun").textContent = card.kunyomi;
        rac("on").textContent = card.onyomi;
        rac("radical").textContent = card.radical;
        //rac("correct").textContent = card.correct;

        const vocabulary = card.vocabulary;

        if (Array.isArray(vocabulary)) {
            rac("words").textContent = vocabulary
                .map((word) => {
                    if (word && typeof word === "object") {
                        return word.reading ?? word.word ?? "";
                    }

                    return word ?? "";
                })
                .join("、");
        } else {
            rac("words").textContent = vocabulary ?? "";
        }

        rac("card").classList.add("show");

        hasAnswered = false;
        rac("approve").hidden = false;
        rac("approve").disabled = false;

        rac("refuse").hidden = false;
        rac("refuse").disabled = false;
    }

    function answer(playerSaysValid) {
        if (hasAnswered) {
            return;
        }

        hasAnswered = true;

        const card = kanji[kanji_number_order];

        const playerIsRight =
            playerSaysValid === card.correct;

        if (playerIsRight) {
            score++;
        }

        rac("approve").disabled = true;
        rac("refuse").disabled = true;

        nextCard();

    }


    function nextCard() {
        if (!hasAnswered) {
            return;
        }
        rac("approve").hidden = true;
        rac("refuse").hidden = true;

        rac("card").classList.remove("show");

        rac("sprite").classList.add("walking");


        rac("walker").className = "";
        void rac("walker").offsetWidth;
        rac("walker").className = "out";
    }


    function finishGame() {

        rac("stage").style.display = "none";
        rac("card").style.display = "none";

        document.querySelector(".btns").style.display = "none";
        rac("progress").style.display = "none";

        rac("end").style.display = "block";

        const title = document.createElement("h2");
        title.textContent = "Shift complete!";

        const result = document.createElement("p");
        result.append("Final Score: ");

        const playAgain = document.createElement("button");
        playAgain.className = "button_retour";
        playAgain.style.background = "var(--ink)";
        playAgain.style.marginTop = "10px";
        playAgain.textContent = "Play again";

        playAgain.addEventListener("click", () => {
            location.reload();
        });

        rac("end").replaceChildren(
            title,
            result,
            playAgain
        );
    }


    rac("approve").addEventListener("click", () => {
        answer(true);
    });

    rac("refuse").addEventListener("click", () => {
        answer(false);
    });

    playMusic({{mute}});
    start_game();



</script>

</body>
</html>
