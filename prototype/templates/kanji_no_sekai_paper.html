<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanji Passport, please</title>
    <style>
        :root {
            --ink: #2b2b2b;
            --paper: #faf6ee;
            --ok: #8fc31f;
            --ko: #e5231b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, "Noto Sans CJK JP", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 16px;
            background: var(--paper);
            color: var(--ink);
            max-width: 560px;
            margin-inline: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .9rem;
        }

        .button_retour {
            padding: 8px 16px;
            font-size: 15px;
            background: mediumvioletred;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #stage {
            position: relative;
            height: 190px;
            overflow: hidden;
        }

        #walker {
            position: absolute;
            top: 6px;
            left: -40%;
            transform: translateX(-50%);
        }

        #sprite {
            font-size: 7.5rem;
            line-height: 1.1;
            display: inline-block;
        }

        #walker.in {
            animation: walkIn 1.8s ease-out forwards;
        }

        #walker.out {
            animation: walkOut .9s ease-in forwards;
        }

        #sprite.walking {
            animation: bob .35s ease-in-out infinite;
        }

        @keyframes walkIn {
            from {
                left: -40%;
            }
            to {
                left: 50%;
            }
        }

        @keyframes walkOut {
            from {
                left: 50%;
            }
            to {
                left: 140%;
            }
        }

        @keyframes bob {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-12px) rotate(4deg);
            }
        }

        #card {
            display: none;
            background: #ffe94d;
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 10px;
            min-height: 210px;
        }

        #card.show {
            display: block;
            animation: pop .45s ease-out;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.95);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .head {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .photo {
            font-size: 2.6rem;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 6px;
            padding: 0 10px;
            line-height: 1.3;
        }

        #strokes {
            background: #222;
            border-radius: 4px;
            padding: 3px 6px;
            color: #fff;
            font-size: .6rem;
        }

        #strokes img {
            display: block;
            height: 44px;
        }

        .row {
            margin: 6px 0 0;
            font-size: 1.25rem;
        }

        .row b {
            display: inline-block;
            min-width: 70px;
            font-weight: 600;
        }

        .row.small {
            font-size: 1rem;
        }


        .btns {
            display: flex;
            justify-content: space-around;
            margin: 6px 0;
        }

        .rond {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 1px solid var(--ink);
            font-size: 2.6rem;
            color: #fff;
            cursor: pointer;
        }

        .rond:disabled {
            opacity: .35;
            cursor: default;
        }

        #refuse {
            background: var(--ko);
        }

        #approve {
            background: var(--ok);
        }

        #msg {
            min-height: 2.8em;
            font-weight: 600;
            text-align: center;
            margin: 6px 0;
        }

        .good {
            color: #2e7d32;
        }

        .bad {
            color: #b3261e;
        }

        #next, #again {
            display: none;
            margin: 0 auto;
            padding: 10px 22px;
            font-size: 1rem;
            background: var(--ink);
            color: #fff;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }

        #end {
            display: none;
            text-align: center;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="top">
    <button class="button_retour" onclick="location.href='/choice_game_meaning'">BACK</button>
    <header>
        <div>
        <span>ID : <span id="player_id">{{ player_id }}</span></span> |
        <span>Level : <span id="level">{{ level }}</span></span>
    </div>
</header>
</div>

<div id="stage">
    <div id="walker"><span id="sprite"></span></div>
</div>

<div id="card">
    <div class="head">
        <div class="photo" id="photo"></div>
        <div id="strokes">
            <div>Stroke order</div>
            <img id="strokeImg" alt=""></div>
    </div>
    <div class="row"><b>Kun :</b><span id="f-kun"></span></div>
    <div class="row"><b>On :</b><span id="f-on"></span></div>
    <div class="row small"><b>Meaning 意味 :</b><span id="f-sens"></span></div>
    <div class="row small"><b>Words 語彙 :</b><span id="f-vocab"></span></div>
</div>


<div class="btns">
    <button class="rond" id="refuse" disabled>✘</button>
    <button class="rond" id="approve" disabled>✔</button>
</div>
<div id="msg"></div>
<button id="next">Next kanji →</button>
<div id="end"></div>

<script>
    // ===== SETTINGS =====

    const DATA_URL = "/passport_data";

    const $ = id => document.getElementById(id);
    const participant = new URLSearchParams(location.search).get("p") || "1";
    $("participant").textContent = participant;


    let cartes = [], recueil = [], idx = 0, score = 0, left = 0, repondu = false, t0 = 0;
    const SECOURS = [
        {
            kanji: "火",
            kun: ["ひ"],
            on: ["カ"],
            sens: "fire, flame",
            vocab: ["花火", "火山"],
            correct: true,
            champ_faux: null,
            valeur_correcte: null
        },
        {
            kanji: "日",
            kun: ["やま"],
            on: ["ニチ"],
            sens: "day, sun",
            vocab: ["日本"],
            correct: false,
            champ_faux: "kun",
            valeur_correcte: "ひ"
        }
    ];

    async function charger() {
        try {
            const r = await fetch(DATA_URL);
            if (!r.ok) throw new Error("server error");
            const d = await r.json();
            cartes = d.cartes;
            recueil = d.recueil;
            left = d.nb_consultations;
        } catch (e) {
            console.warn("Fallback mode:", e);
            cartes = SECOURS;
            recueil = [];
            left = 1;
        }
        $("tot").textContent = cartes.length;

        entrer();
    }


    function entrer() {
        const c = cartes[idx];
        $("i").textContent = idx + 1;
        $("msg").textContent = "";
        $("next").style.display = "none";
        $("card").classList.remove("show");
        $("sprite").textContent = c.kanji;
        $("sprite").classList.add("walking");
        const w = $("walker");
        w.className = "";
        void w.offsetWidth;
        w.className = "in";   // restart animation
    }

    $("walker").addEventListener("animationend", e => {
        if (e.target !== $("walker")) return;
        $("sprite").classList.remove("walking");
        if (e.animationName === "walkIn") montrerCarte();
        else {
            idx++;
            idx >= cartes.length ? terminer() : entrer();
        }
    });

    function montrerCarte() {
        const c = cartes[idx];
        $("photo").textContent = c.kanji;
        $("f-kun").textContent = c.kun.join("・");
        $("f-on").textContent = c.on.join("・");
        $("f-sens").textContent = c.sens;
        $("f-vocab").textContent = c.vocab.join("、");
        const img = $("strokeImg"), box = $("strokes");
        box.style.display = "";
        img.onerror = () => box.style.display = "none";
        img.src = STROKE_IMG(c.kanji);
        $("card").classList.add("show");
        repondu = false;
        t0 = Date.now();
        $("approve").disabled = false;
        $("refuse").disabled = false;
    }

    function repondre(approve) {
        if (repondu) return;
        repondu = true;
        const c = cartes[idx], bon = approve === c.correct;
        if (bon) score++;
        $("score").textContent = score;
        const nom = {kun: "the kun reading", on: "the on reading", sens: "the meaning", vocab: "the vocabulary"};
        $("msg").className = bon ? "good" : "bad";
        $("msg").textContent = (bon ? "Good call! " : "Wrong! ") + (c.champ_faux
            ? `${nom[c.champ_faux]} was wrong (correct: ${c.valeur_correcte}).` : "The card was valid.");
        $("approve").disabled = true;
        $("refuse").disabled = true;
        $("next").style.display = "block";
        $("next").textContent = idx + 1 >= cartes.length ? "See result" : "Next kanji →";
    }

    function suivant() {
        $("next").style.display = "none";
        $("card").classList.remove("show");
        $("sprite").classList.add("walking");
        $("walker").className = "out";
    }

    function terminer() {
        $("end").style.display = "block";
        $("stage").style.display = "none";
        document.querySelector(".btns").style.display = "none";
        $("end").innerHTML = `<h2>Shift complete!</h2><p>Score: <b>${score}/${cartes.length}</b></p><button id="again" style="display:inline-block" onclick="location.reload()">Play again</button>`;
    }

    $("approve").onclick = () => repondre(true);
    $("refuse").onclick = () => repondre(false);
    $("next").onclick = suivant;
    charger();
</script>
</body>
</html>
